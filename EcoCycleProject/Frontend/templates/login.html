<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login & Register | EcoCycle™</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #112211 0%, #2d6a4f 100%); overflow: hidden; font-family: 'Inter', sans-serif; }
        .tree { position: absolute; bottom: 20px; opacity: 0.2; pointer-events: none; animation: wind 5s ease-in-out infinite; }
        @keyframes wind { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
        .glass-login { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-radius: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); z-index: 10; }
        
        .waves { position: absolute; bottom: 0; width: 100%; height: 15vh; min-height: 100px; max-height: 150px; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; fill: rgba(255,255,255,0.3); }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; fill: rgba(255,255,255,0.5); }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; fill: rgba(255,255,255,0.2); }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }

        .bubble { position: absolute; bottom: -20px; background: rgba(255,255,255,0.2); border-radius: 50%; animation: rise 10s infinite ease-in; }
        @keyframes rise { 0% { bottom: -20px; transform: translateX(0); opacity: 1; } 100% { bottom: 100vh; transform: translateX(100px); opacity: 0; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">
    <div class="tree left-10 text-[200px]">🌲</div>
    <div class="tree right-10 text-[200px]">🌳</div>

    <div class="bubble" style="left:10%; width:40px; height:40px; animation-duration:8s;"></div>
    <div class="bubble" style="left:30%; width:20px; height:20px; animation-duration:12s; animation-delay:2s;"></div>
    <div class="bubble" style="left:70%; width:50px; height:50px; animation-duration:10s; animation-delay:4s;"></div>

    <svg class="waves" viewBox="0 24 150 28" preserveAspectRatio="none">
        <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
        <g class="parallax">
            <use xlink:href="#gentle-wave" x="48" y="0" />
            <use xlink:href="#gentle-wave" x="48" y="3" />
            <use xlink:href="#gentle-wave" x="48" y="5" />
        </g>
    </svg>

    <div class="glass-login p-10 w-96 text-center border border-white/20">
        <h1 class="text-4xl font-black text-green-800 tracking-tighter mb-2">EcoCycle™</h1>
        <p class="text-green-700 font-bold mb-6 italic text-sm">One Small Step Today,<br>A Greener World Tomorrow.</p>
        
        <div>
            <h3 id="formTitle" class="text-xl font-extrabold text-green-950 mb-4 uppercase tracking-tight">Login Portal</h3>
            <div class="space-y-4">
                <input type="text" id="authUsername" placeholder="Enter Your Name" class="w-full p-4 rounded-2xl bg-emerald-50 border border-green-200 focus:outline-none text-sm font-semibold" required>
                
                <div class="relative w-full">
                    <input type="password" id="authPassword" placeholder="Password" class="w-full p-4 pr-12 rounded-2xl bg-emerald-50 border border-green-200 focus:outline-none text-sm font-semibold" required>
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-lg opacity-60 hover:opacity-100 select-none">👁️</button>
                </div>

                <button type="button" onclick="submitAuth()" id="actionBtn" class="w-full bg-green-700 text-white font-black py-4 rounded-2xl hover:bg-green-800 shadow-lg uppercase text-xs tracking-wider transition-all">Enter the Ecosystem</button>
            </div>
            
            <div class="mt-6 pt-4 border-t border-green-900/10 text-xs font-bold text-green-800">
                <span id="switchPrompt">New member of the movement?</span>
                <button onclick="toggleAuthMode()" id="switchBtn" class="text-emerald-600 underline ml-1 cursor-pointer hover:text-green-900">Register Here</button>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function togglePasswordVisibility() {
            const passField = document.getElementById('authPassword');
            passField.type = passField.type === 'password' ? 'text' : 'password';
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').innerText = isLoginMode ? "Login Portal" : "Account Registration";
            document.getElementById('actionBtn').innerText = isLoginMode ? "Enter the Ecosystem" : "Register Credentials";
            document.getElementById('switchPrompt').innerText = isLoginMode ? "New member of the movement?" : "Already registered?";
            document.getElementById('switchBtn').innerText = isLoginMode ? "Register Here" : "Login Now";
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
        }

        function submitAuth() {
            const u = document.getElementById('authUsername').value.trim();
            const p = document.getElementById('authPassword').value.trim();

            if (!u || !p) return alert("Please fill all configuration parameters!");

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            
            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(resObj => {
                if (resObj.status !== 200) {
                    alert("Error Management Alert: " + resObj.body.error);
                } else {
                    if (isLoginMode) {
                        sessionStorage.removeItem('hasVisited'); 
                        window.location.href = resObj.body.redirect;
                    } else {
                        alert(resObj.body.success);
                        toggleAuthMode();
                    }
                }
            })
            .catch(err => alert("System pipeline network error occurred!"));
        }
    </script>
</body>
</html>
